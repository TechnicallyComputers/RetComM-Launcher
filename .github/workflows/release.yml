name: Release

# Manual only — does not run on push/PR. Leave version empty to auto-bump the
# next x.x.x from the latest vX.Y.Z tag, then publish a GitHub Release after a
# successful multi-platform build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Semver without leading v (e.g. 0.6.4). Leave empty to auto-bump from
          the latest vX.Y.Z git tag (see bump).
        required: false
        type: string
        default: ""
      bump:
        description: "When version is empty, which semver component to increment"
        type: choice
        options:
          - patch
          - minor
          - major
        required: false
        default: patch
      prerelease:
        description: "Mark GitHub release as prerelease"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  SDL_TAG: "release-3.2.16"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: v
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(printf '%s' "${{ inputs.version }}" | tr -d '[:space:]')"
          BUMP="${{ inputs.bump || 'patch' }}"

          bump_semver() {
            local base="$1" which="${2:-patch}"
            local ma mi pa
            base="${base#v}"
            base="${base%%[-+]*}"
            if [[ ! "${base}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::cannot bump non-semver base '${base}'" >&2
              exit 1
            fi
            IFS=. read -r ma mi pa <<<"${base}"
            ma="${ma:-0}"; mi="${mi:-0}"; pa="${pa:-0}"
            case "${which}" in
              major) ma=$((ma + 1)); mi=0; pa=0 ;;
              minor) mi=$((mi + 1)); pa=0 ;;
              patch) pa=$((pa + 1)) ;;
              *)
                echo "::error::unknown bump '${which}' (want patch|minor|major)" >&2
                exit 1
                ;;
            esac
            printf '%s.%s.%s' "${ma}" "${mi}" "${pa}"
          }

          if [[ -z "${RAW}" ]]; then
            LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)"
            BASE="${LATEST#v}"
            if [[ -z "${BASE}" ]]; then
              # Seed from CMakeLists only when the repo has no release tags yet.
              BASE="$(sed -n 's/.*set(RETCOMM_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt | head -1 || true)"
              BASE="${BASE#v}"
              BASE="${BASE%%[-+]*}"
            fi
            BASE="${BASE:-0.0.0}"
            VER="$(bump_semver "${BASE}" "${BUMP}")"
            echo "Auto-bumped ${BUMP}: ${LATEST:-none (${BASE})} → ${VER}"
          else
            VER="${RAW#v}"
            if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.+-]*)?$ ]]; then
              echo "::error::Invalid version: ${VER} (expected semver like 0.1.2)" >&2
              exit 1
            fi
          fi

          TAG="v${VER}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1 || \
             git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::tag ${TAG} already exists — bump again or pass an explicit version" >&2
            exit 1
          fi

          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building RetComM ${VER} (tag ${TAG})"

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libcurl4-openssl-dev libgl1-mesa-dev \
            librsvg2-bin curl ca-certificates \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev \
            libibus-1.0-dev libudev-dev

      - name: Build icons
        run: |
          chmod +x packaging/make-icons.sh packaging/linux/*.sh
          ./packaging/make-icons.sh

      - name: Build SDL3
        run: |
          git clone --depth 1 --branch "${SDL_TAG}" https://github.com/libsdl-org/SDL.git "$HOME/SDL"
          cmake -G Ninja -S "$HOME/SDL" -B "$HOME/sdl-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/sdl3" \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF
          cmake --build "$HOME/sdl-build" -j"$(nproc)"
          cmake --install "$HOME/sdl-build"

      - name: Configure & build RetComM
        run: |
          test -f assets/fonts/LatoLatin-Regular.ttf
          test -f assets/fonts/LatoLatin-Bold.ttf
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/out" \
            -DCMAKE_PREFIX_PATH="$HOME/sdl3" \
            -DRETCOMM_VERSION="${{ needs.version.outputs.version }}"
          cmake --build build -j"$(nproc)"
          cmake --install build
          # Hub fonts must be in the install prefix for AppImage packaging.
          test -f out/share/retcomm/fonts/LatoLatin-Regular.ttf
          test -f out/share/retcomm/fonts/LatoLatin-Bold.ttf
          ls -lah out/share/retcomm/fonts/
          # First-run setup card art — blank Easy/Advanced cards ship silently
          # otherwise (the dev build finds assets/ by walking up; a package cannot).
          test -f out/share/retcomm/setup/setup_easy_rocket.png
          test -f out/share/retcomm/setup/setup_advanced_wrench.png
          # Bundle SDL3 next to binaries for the AppImage.
          mkdir -p out/lib
          cp -a "$HOME/sdl3/lib/"*.so* out/lib/

      - name: Package AppImage
        run: |
          export PATH="$HOME/sdl3/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/sdl3/lib:${LD_LIBRARY_PATH:-}"
          ./packaging/linux/build-appimage.sh "$PWD/out" "${{ needs.version.outputs.version }}" x86_64
          ls -lah dist/
          test -f "dist/RetComM-Launcher-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: |
            dist/RetComM-Launcher-linux-x86_64.AppImage
          retention-days: 5

  windows:
    needs: version
    # Pin 2022 image: VS 2022 generator + stable MSVC tooling.
    runs-on: windows-2022
    env:
      # Do not use VCPKG_ROOT — VS may override it with its bundled copy.
      RETCOMM_VCPKG: ${{ github.workspace }}/retcomm-vcpkg
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = "9d7f79f56ae1a9b4704d6a7fb8237e347a974133"
          git clone https://github.com/microsoft/vcpkg.git $env:RETCOMM_VCPKG
          git -C $env:RETCOMM_VCPKG checkout $baseline

          # bootstrap.ps1 uses tls12-download.exe with no retries; GitHub release
          # assets intermittently return 503 and abort the job. Prefetch the
          # pinned vcpkg-tool with curl retries, then skip bootstrap's download.
          $metaPath = Join-Path $env:RETCOMM_VCPKG "scripts\vcpkg-tool-metadata.txt"
          $meta = ConvertFrom-StringData (Get-Content $metaPath -Raw)
          $tag = $meta.VCPKG_TOOL_RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "VCPKG_TOOL_RELEASE_TAG missing from $metaPath"
          }
          $url = "https://github.com/microsoft/vcpkg-tool/releases/download/$tag/vcpkg.exe"
          $dest = Join-Path $env:RETCOMM_VCPKG "vcpkg.exe"
          $ok = $false
          for ($i = 1; $i -le 10; $i++) {
            Write-Host "Downloading vcpkg.exe attempt $i/10 ($url)"
            if (Test-Path $dest) { Remove-Item -LiteralPath $dest -Force }
            & curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 2 `
              --connect-timeout 30 --max-time 300 -o $dest $url
            if ($LASTEXITCODE -eq 0 -and (Test-Path $dest) -and ((Get-Item $dest).Length -gt 1MB)) {
              $ok = $true
              break
            }
            Start-Sleep -Seconds ([Math]::Min(60, 3 * $i))
          }
          if (-not $ok) {
            throw "Failed to download vcpkg.exe from $url after retries (transient CDN/503?)"
          }
          Set-Content -LiteralPath (Join-Path $env:RETCOMM_VCPKG "vcpkg.disable-metrics") -Value ""
          & $dest version --disable-metrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg.exe failed to run after download" }

      - name: Build icons
        shell: bash
        run: |
          chmod +x packaging/make-icons.sh
          ./packaging/make-icons.sh

      - name: Configure & build
        shell: bash
        run: |
          test -f assets/fonts/LatoLatin-Regular.ttf
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="${RETCOMM_VCPKG}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DCMAKE_INSTALL_PREFIX="$PWD/out" \
            -DRETCOMM_VERSION="${{ needs.version.outputs.version }}"
          cmake --build build --config Release -j
          cmake --install build --config Release
          test -f out/share/retcomm/fonts/LatoLatin-Regular.ttf
          test -f out/share/retcomm/setup/setup_easy_rocket.png
          test -f out/share/retcomm/setup/setup_advanced_wrench.png

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after innosetup install" }
          Write-Host "ISCC: $iscc"

      - name: Package portable + installer
        shell: pwsh
        run: |
          # Manifest-mode vcpkg installs under build/vcpkg_installed/…, not the
          # classic $RETCOMM_VCPKG/installed/… tree. zlib may be zlib1.dll or z.dll.
          $ws = $env:GITHUB_WORKSPACE
          $releaseDir = Join-Path $ws "build\Release"
          $candidates = @(
            (Join-Path $ws "build\vcpkg_installed\x64-windows\bin"),
            (Join-Path $ws "vcpkg_installed\x64-windows\bin"),
            (Join-Path $env:RETCOMM_VCPKG "installed\x64-windows\bin"),
            $releaseDir,
            (Join-Path $ws "out\bin")
          )
          function Test-HasRuntimeDlls([string]$Dir) {
            if (-not (Test-Path $Dir)) { return $false }
            $hasSdl = Test-Path (Join-Path $Dir "SDL3.dll")
            $hasCurl = (Test-Path (Join-Path $Dir "libcurl.dll")) -or
                       (Get-ChildItem $Dir -Filter "libcurl*.dll" -ErrorAction SilentlyContinue)
            $hasZ = (Test-Path (Join-Path $Dir "zlib1.dll")) -or
                    (Test-Path (Join-Path $Dir "z.dll")) -or
                    (Test-Path (Join-Path $Dir "zlib.dll"))
            return ($hasSdl -and $hasCurl -and $hasZ)
          }
          $vcpkgBin = $null
          foreach ($c in $candidates) {
            Write-Host "probe: $c"
            if (Test-Path $c) {
              Get-ChildItem $c -Filter "*.dll" -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  $($_.Name)" }
            }
            if (Test-HasRuntimeDlls $c) { $vcpkgBin = $c; break }
          }
          if (-not $vcpkgBin) {
            # Last resort: find zlib next to a harvested SDL3 under build/.
            $zHit = Get-ChildItem -Path (Join-Path $ws "build") -Recurse -Include @(
              "zlib1.dll", "z.dll", "zlib.dll") -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($zHit) {
              $vcpkgBin = $zHit.DirectoryName
              Write-Host "Discovered zlib at $vcpkgBin"
            }
          }
          if (-not $vcpkgBin) {
            throw "Could not locate a DLL directory containing SDL3 + libcurl + zlib (zlib1.dll or z.dll)"
          }
          Write-Host "Using runtime DLL dir: $vcpkgBin"
          ./packaging/windows/package.ps1 `
            -Prefix (Join-Path $ws "out") `
            -Version "${{ needs.version.outputs.version }}" `
            -VcpkgBin $vcpkgBin `
            -Arch x64 `
            -InnoSetup "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $stage = Join-Path dist "windows-stage"
          Write-Host "staged DLLs:"
          Get-ChildItem $stage -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }
          foreach ($needDll in @("libcurl.dll", "SDL3.dll")) {
            if (-not (Test-Path (Join-Path $stage $needDll))) {
              throw "Staged payload missing required DLL: $needDll"
            }
          }
          $hasZlib = (Test-Path (Join-Path $stage "zlib1.dll")) -or
                     (Test-Path (Join-Path $stage "z.dll")) -or
                     (Test-Path (Join-Path $stage "zlib.dll"))
          if (-not $hasZlib) {
            throw "Staged payload missing zlib runtime (zlib1.dll / z.dll / zlib.dll)"
          }
          Get-ChildItem dist
          $need = @(
            "RetComM-Launcher-portable-windows.zip",
            "RetComM Launcher.exe",
            "RetComM-Launcher-windows-x64-setup.exe"
          )
          foreach ($n in $need) {
            $p = Join-Path dist $n
            if (-not (Test-Path $p)) { throw "Missing release artifact: $n" }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/RetComM-Launcher-portable-windows.zip
            dist/RetComM-Launcher-windows-x64-setup.exe
          retention-days: 5

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          # macos-13 was retired Dec 2025; macos-15-intel is the last hosted x86_64 image.
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: |
          brew update
          brew install cmake ninja sdl3 curl librsvg || brew install cmake ninja sdl3 curl
          chmod +x packaging/make-icons.sh packaging/macos/build-app.sh \
            packaging/macos/bundle_dylibs.sh

      - name: Build icons
        run: ./packaging/make-icons.sh

      - name: Configure & build
        run: |
          test -f assets/fonts/LatoLatin-Regular.ttf
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/out" \
            -DRETCOMM_VERSION="${{ needs.version.outputs.version }}" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}"
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          cmake --install build
          test -f out/share/retcomm/fonts/LatoLatin-Regular.ttf
          test -f out/share/retcomm/setup/setup_easy_rocket.png
          test -f out/share/retcomm/setup/setup_advanced_wrench.png
          # Smoke-check hub linked.
          file out/bin/retcomm-hub
          otool -L out/bin/retcomm-hub | head

      - name: Package DMG
        run: |
          ./packaging/macos/build-app.sh "$PWD/out" "${{ needs.version.outputs.version }}" "${{ matrix.arch }}"
          ls -lah dist/
          test -f "dist/RetComM-Launcher-macos-${{ matrix.arch }}.dmg"
          test -d "dist/RetComM Launcher.app/Contents/Resources/fonts"
          test -f "dist/RetComM Launcher.app/Contents/Resources/fonts/LatoLatin-Regular.ttf"
          # bundle_dylibs.sh already fails on leftover cellar paths; dump for logs.
          echo "=== Frameworks ==="
          ls -lah "dist/RetComM Launcher.app/Contents/Frameworks/"
          echo "=== retcomm-hub ==="
          otool -L "dist/RetComM Launcher.app/Contents/MacOS/retcomm-hub"
          for f in "dist/RetComM Launcher.app/Contents/Frameworks/"*; do
            echo "=== $(basename "$f") ==="
            otool -L "$f"
          done
          if otool -L "dist/RetComM Launcher.app/Contents/MacOS/"* \
               "dist/RetComM Launcher.app/Contents/Frameworks/"* \
               | grep -E '/usr/local/|/opt/homebrew/'; then
            echo "::error::bundled app still references Homebrew dylibs" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/RetComM-Launcher-macos-${{ matrix.arch }}.dmg
          retention-days: 5

  publish:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -exec cp -v {} dist/ \;
          ls -lah dist/
          test -n "$(ls -A dist)" || { echo "No release artifacts found" >&2; exit 1; }
          # Guaranteed end-user set. Stable names (version is the release tag).
          test -f dist/RetComM-Launcher-linux-x86_64.AppImage
          test -f dist/RetComM-Launcher-windows-x64-setup.exe
          test -f dist/RetComM-Launcher-portable-windows.zip
          test -f dist/RetComM-Launcher-macos-arm64.dmg
          test -f dist/RetComM-Launcher-macos-x86_64.dmg
          # Do not publish the loose portable stub — only the zip (friendly exe inside).
          rm -f "dist/RetComM Launcher.exe"

      - name: Ensure release tag exists
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally (from fetch)."
          elif git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on origin."
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          else
            echo "Creating annotated tag ${TAG} at ${GITHUB_SHA}"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "RetComM Launcher ${VERSION}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: RetComM Launcher ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
