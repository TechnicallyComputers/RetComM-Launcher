name: Release

# Manual only — does not run on push/PR. Creates tag v<version> and publishes
# GitHub Release assets after a successful multi-platform build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without leading v (e.g. 0.1.2). Empty = RETCOMM_VERSION from CMakeLists.txt"
        required: false
        default: ""
      prerelease:
        description: "Mark GitHub release as prerelease"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  SDL_TAG: "release-3.2.16"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          else
            VER="$(sed -n 's/.*set(RETCOMM_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt | head -1)"
            if [[ -z "$VER" ]]; then
              echo "Could not read RETCOMM_VERSION from CMakeLists.txt" >&2
              exit 1
            fi
          fi
          # Normalize: strip a leading v if the operator typed one.
          VER="${VER#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid version: ${VER} (expected semver like 0.1.2)" >&2
            exit 1
          fi
          TAG="v${VER}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building RetComM ${VER} (tag ${TAG})"

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libcurl4-openssl-dev libgl1-mesa-dev \
            librsvg2-bin zip curl ca-certificates \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev \
            libibus-1.0-dev libudev-dev

      - name: Build icons
        run: |
          chmod +x packaging/make-icons.sh packaging/linux/*.sh
          ./packaging/make-icons.sh

      - name: Build SDL3
        run: |
          git clone --depth 1 --branch "${SDL_TAG}" https://github.com/libsdl-org/SDL.git "$HOME/SDL"
          cmake -G Ninja -S "$HOME/SDL" -B "$HOME/sdl-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/sdl3" \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF
          cmake --build "$HOME/sdl-build" -j"$(nproc)"
          cmake --install "$HOME/sdl-build"

      - name: Configure & build RetComM
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/out" \
            -DCMAKE_PREFIX_PATH="$HOME/sdl3" \
            -DRETCOMM_VERSION="${{ needs.version.outputs.version }}"
          cmake --build build -j"$(nproc)"
          cmake --install build
          # Bundle SDL3 next to binaries for the portable zip / AppImage.
          mkdir -p out/lib
          cp -a "$HOME/sdl3/lib/"*.so* out/lib/

      - name: Package AppImage + zip
        run: |
          export PATH="$HOME/sdl3/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/sdl3/lib:${LD_LIBRARY_PATH:-}"
          ./packaging/linux/build-appimage.sh "$PWD/out" "${{ needs.version.outputs.version }}" x86_64
          ./packaging/linux/package-zip.sh "$PWD/out" "${{ needs.version.outputs.version }}" x86_64
          ls -lah dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/RetComM-Launcher-*-linux-x86_64.AppImage
            dist/RetComM-Launcher-*-linux-x86_64.zip

  windows:
    needs: version
    # Pin 2022 image: VS 2022 generator + stable MSVC tooling.
    runs-on: windows-2022
    env:
      # Do not use VCPKG_ROOT — VS may override it with its bundled copy.
      RETCOMM_VCPKG: ${{ github.workspace }}/retcomm-vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $baseline = "9d7f79f56ae1a9b4704d6a7fb8237e347a974133"
          git clone https://github.com/microsoft/vcpkg.git $env:RETCOMM_VCPKG
          git -C $env:RETCOMM_VCPKG checkout $baseline
          & "$env:RETCOMM_VCPKG\bootstrap-vcpkg.bat" -disableMetrics

      - name: Build icons
        shell: bash
        run: |
          chmod +x packaging/make-icons.sh
          ./packaging/make-icons.sh

      - name: Configure & build
        shell: bash
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="${RETCOMM_VCPKG}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DCMAKE_INSTALL_PREFIX="$PWD/out" \
            -DRETCOMM_VERSION="${{ needs.version.outputs.version }}"
          cmake --build build --config Release -j
          cmake --install build --config Release

      - name: Package zip
        shell: pwsh
        run: |
          # CMake install ships TARGET_RUNTIME_DLLS into out/bin. Also pass the
          # MSVC Release dir where vcpkg applocal copies SDL3/libcurl during build.
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "build\Release"
          Write-Host "out/bin DLLs:"
          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "out\bin") -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Host "build/Release DLLs:"
          Get-ChildItem $releaseDir -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.Name)" }
          ./packaging/windows/package.ps1 `
            -Prefix (Join-Path $env:GITHUB_WORKSPACE "out") `
            -Version "${{ needs.version.outputs.version }}" `
            -VcpkgBin $releaseDir `
            -Arch x64
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/RetComM-Launcher-*-windows-x64.zip

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          # macos-13 was retired Dec 2025; macos-15-intel is the last hosted x86_64 image.
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew update
          brew install cmake ninja sdl3 curl librsvg || brew install cmake ninja sdl3 curl
          chmod +x packaging/make-icons.sh packaging/macos/build-app.sh

      - name: Build icons
        run: ./packaging/make-icons.sh

      - name: Configure & build
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/out" \
            -DRETCOMM_VERSION="${{ needs.version.outputs.version }}" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}"
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          cmake --install build
          # Smoke-check hub linked.
          file out/bin/retcomm-hub
          otool -L out/bin/retcomm-hub | head

      - name: Package .app zip
        run: |
          ./packaging/macos/build-app.sh "$PWD/out" "${{ needs.version.outputs.version }}" "${{ matrix.arch }}"
          ls -lah dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/RetComM-Launcher-*-macos-${{ matrix.arch }}.zip

  publish:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.AppImage' -o -name '*.zip' \) -exec cp -v {} dist/ \;
          ls -lah dist/
          test -n "$(ls -A dist)" || { echo "No release artifacts found" >&2; exit 1; }

      - name: Ensure release tag exists
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally (from fetch)."
          elif git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on origin."
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          else
            echo "Creating annotated tag ${TAG} at ${GITHUB_SHA}"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "RetComM Launcher ${VERSION}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: RetComM Launcher ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
